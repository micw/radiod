[package]
name = "radiod"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
gstreamer = "0.24"
alsa = "0.11"
url = "2"
ipnet = { version = "2", features = ["serde"] }
roxmltree = "0.21"
uuid = { version = "1", features = ["v4"] }
signal-hook = "0.3"
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }

[build-dependencies]
cc = "1"
pkg-config = "0.3"
