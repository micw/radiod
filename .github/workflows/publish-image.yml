name: Test and publish image

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container: rust:1.99-trixie
    steps:
      - uses: actions/checkout@v4
      - name: Install native libraries and test plugins
        run: |
          apt-get update
          apt-get install -y --no-install-recommends pkg-config libgstreamer1.0-dev libasound2-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav python3
      - run: cargo test --locked
      - run: cargo build --locked
      - run: target/debug/radiod --config examples/radiod.yaml --check-config
      - run: python3 tests/smoke.py
      - run: python3 tests/streaming.py
      - run: python3 tests/metadata.py
      - run: python3 -m unittest discover -s tests -p 'test_*.py'

  publish:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
